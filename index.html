<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NARS AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <div class="sidebar-top">

        <h2>NARS</h2>

        <button class="new-chat">
          + New Chat
        </button>

      </div>

      <div class="chat-history">

        <p class="history-title">Recent</p>

        <button class="history-item">
          Medication Safety
        </button>

        <button class="history-item">
          Medicine Question
        </button>

      </div>

      <div class="sidebar-bottom">
        <p>About NARS</p>
      </div>

    </aside>


    <!-- MAIN CHAT AREA -->
    <main class="main">

      <header class="topbar">

        <h3>NARS AI</h3>

      </header>


      <section class="chat-area">

        <div class="welcome">

          <div class="logo">
            N
          </div>

          <h1>How can I help you today?</h1>

          <p>
            Ask NARS about medication safety and responsible
            self-medication practices.
          </p>

        </div>

      </section>


      <!-- MESSAGE INPUT -->
      <div class="input-area">

        <div class="input-container">

          <textarea
            id="messageInput"
            placeholder="Message NARS..."
            rows="1"
          ></textarea>

          <button class="send-button">
            ↑
          </button>

        </div>

        <p class="disclaimer">
          NARS provides general medication safety information
          and DOES NOT replace professional medical advice.
        </p>

      </div>

    </main>

  </div>

  <script src="script.js"></script>

</body>
</html>
